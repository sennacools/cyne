<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CYNÉ | Interior architecture, spatial design & scenography</title>
  <meta name="description" content="CYNÉ creates timeless spaces with a character of their own: interior architecture, spatial design and scenography.">
  <link rel="icon" type="image/png" href="images/logo/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <style>
    /* Home: one quiet page, like walking into a room with leaf shadows on the wall. */
    :root {
      --ink: #1a1614;
      --ink-soft: #3a3430;
      --serif: "Cormorant Garamond", Garamond, "Times New Roman", serif;
      --sans: "Jost", "Helvetica Neue", Arial, sans-serif;
      --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      background: #f0e8df;
      color: var(--ink);
      font-family: var(--sans);
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }

    /* the wall: pure gradients, sharp on every screen */
    .wall {
      position: fixed;
      inset: 0;
      background:
        linear-gradient(116deg, rgba(80, 64, 52, 0) 0%, rgba(80, 64, 52, 0) 61%, rgba(80, 64, 52, 0.13) 72%, rgba(80, 64, 52, 0.19) 100%),
        radial-gradient(ellipse 90% 80% at 42% 58%, #f8f3ec 0%, #f0e8df 55%, #e7ddd2 100%);
    }

    /* leaf shadows: vector branches that sway in the wind (images/leaves.svg),
       drawn at half size and softened by the browser, so they stay smooth */
    .leaves {
      position: fixed;
      left: 0;
      top: 0;
      width: 50vw;
      height: 50vh;
      object-fit: cover;
      object-position: left top;
      transform-origin: 0 0;
      pointer-events: none;
      will-change: transform;
    }
    .leaves.far  { transform: scale(2.3) translate(-2%, -1%); filter: blur(7px) sepia(0.5); opacity: 0.14; animation: drift 26s ease-in-out infinite alternate; }
    .leaves.near { transform: scale(2); filter: blur(3.2px) sepia(0.5); opacity: 0.3; }
    @keyframes drift {
      from { transform: scale(2.3) translate(-2%, -1%); }
      to   { transform: scale(2.36) translate(0%, 1%); }
    }

    .stage { position: relative; height: 100vh; height: 100svh; }

    .mark {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.1rem;
      opacity: 0;
      animation: appear 2s 0.2s var(--ease) forwards;
    }
    .mark img {
      height: clamp(120px, 19vh, 190px);
      width: auto;
      filter: drop-shadow(12px 16px 14px rgba(70, 50, 36, 0.18));
    }
    .mark span {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(2.2rem, 4.4vw, 3.6rem);
      letter-spacing: 0.34em;
      margin-right: -0.34em;          /* keeps the tracked word optically centred */
      line-height: 1;
    }

    .word {
      position: absolute;
      font-family: var(--serif);
      font-style: italic;
      font-weight: 400;
      font-size: clamp(1.45rem, 2vw, 1.9rem);
      color: var(--ink-soft);
      padding: 0.35rem 1.1rem;
      border-radius: 999px;
      opacity: 0;
      animation: appear 1.6s var(--ease) forwards;
      transition: background 0.4s var(--ease), box-shadow 0.4s var(--ease), color 0.3s, transform 0.4s var(--ease);
    }
    .word:hover,
    .word:focus-visible {
      color: var(--ink);
      background: rgba(255, 252, 247, 0.62);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      box-shadow: 0 1px 2px rgba(70, 50, 36, 0.08), 0 14px 30px -10px rgba(70, 50, 36, 0.35);
      transform: translateY(-2px);
      outline: none;
    }
    .w-projects { left: 9%;  top: 49%; animation-delay: 0.9s; }
    .w-about    { left: 64%; top: 36%; animation-delay: 1.1s; }
    .w-contact  { left: 76%; top: 62%; animation-delay: 1.3s; }
    .w-insta    { left: 30%; top: 78%; animation-delay: 1.5s; font-size: clamp(1.2rem, 1.6vw, 1.5rem); }

    @keyframes appear { from { opacity: 0; } to { opacity: 1; } }

    .foot {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.4rem clamp(1.25rem, 3vw, 2.5rem);
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      color: rgba(58, 52, 48, 0.75);
      opacity: 0;
      animation: appear 1.6s 1.7s var(--ease) forwards;
    }

    @media (max-width: 700px) {
      .w-projects { left: 6%;  top: 70%; }
      .w-about    { left: 52%; top: 22%; }
      .w-contact  { left: 50%; top: 80%; }
      .w-insta    { left: 8%;  top: 30%; }
      .foot { flex-direction: column; align-items: center; text-align: center; gap: 0.2rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .leaves.far { animation: none; }
      .mark, .word, .foot { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="wall" aria-hidden="true"></div>
  <img class="leaves far" src="images/leaves.svg" alt="" aria-hidden="true">
  <img class="leaves near" src="images/leaves.svg" alt="" aria-hidden="true">

  <main class="stage">
    <h1 class="mark">
      <img src="images/logo/cyne-swan-dark.png" alt="">
      <span>CYNÉ</span>
    </h1>

    <nav aria-label="Main">
      <a class="word w-projects" href="projects.html">projects</a>
      <a class="word w-about" href="about.html">about us</a>
      <a class="word w-contact" href="contact.html">contact us</a>
      <a class="word w-insta" href="https://www.instagram.com/" target="_blank" rel="noopener">instagram</a>
    </nav>

    <footer class="foot">
      <span>Interior architecture, spatial design &amp; scenography</span>
      <span>© <span id="year">2026</span> CYNÉ</span>
    </footer>
  </main>

  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
